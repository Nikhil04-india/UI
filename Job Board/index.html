<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Job Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <article class="job-board">
    <div class="job-board__top">
      <div class="job-board-headline">
        <!-- SVG office bag icon -->
        <span class="icon-job-board">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3" y="7" width="18" height="13" rx="3" stroke="#23272f" stroke-width="2"/>
            <path d="M8 7V5a4 4 0 0 1 8 0v2" stroke="#23272f" stroke-width="2" stroke-linecap="round"/>
            <path d="M3 13h18" stroke="#23272f" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </span>
        <h2>Job board</h2>
      </div>
      <div class="job-board-description">
        Find a job you love!
      </div>
    </div>
    <header>
      <div class="tabs">
        <a id="tab1" name="all" href="#tab1" class="active">New</a>
        <a id="tab2" name="remote" href="#tab2">Remote</a>
        <a id="tab3" name="onsite" href="#tab3">On-Site</a>
        <a id="tab4" name="hybrid" href="#tab4">Hybrid</a>
      </div>
    </header>
    <div class="tab-content-wrapper">
      <div id="tab1-content" class="tab-content tab-content-active"></div>
      <div id="tab2-content" class="tab-content"></div>
      <div id="tab3-content" class="tab-content"></div>
      <div id="tab4-content" class="tab-content"></div>
    </div>
  </article>
  <script src="script.js"></script>
</body>
</html>
