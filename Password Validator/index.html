<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Password Strength Validator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="box">
    <div class="input_wrapper">
      <input
        id="password"
        type="password"
        name="password"
        placeholder="Your Password"
        autocomplete="off"
        class="input__field"
      />
      <label for="password" class="input__label">Password</label>
      <span class="input__icon">👁️</span>
    </div>
    <div class="password-strength">
      <div class="progress">
        <div
          id="password-strength"
          class="progress-bar"
          role="progressbar"
          aria-valuenow="0"
          aria-valuemin="0"
          aria-valuemax="100"
          style="width:0%; height:3px;"
        ></div>
      </div>
      <ul class="password-strength-items">
        <li class="low-upper-case">
          <span class="ticker">❌</span> &nbsp;Lowercase &amp; Uppercase
        </li>
        <li class="number">
          <span class="ticker">❌</span> &nbsp;Number (0-9)
        </li>
        <li class="special-char">
          <span class="ticker">❌</span> &nbsp;Special Character (!@#$%^&*)
        </li>
        <li class="length">
          <span class="ticker">❌</span> &nbsp;At least 8 Characters
        </li>
      </ul>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
