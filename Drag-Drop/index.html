<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Drag and Drop Team Example</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="groups">
    <div class="group">
      <h2>Members</h2>
      <div id="team-members">
        <article class="team-member">
          <img class="team-member-avatar" src="assets/img1.jpeg" alt="" />
          <div class="team-member-name">
            <h3>Mellisa Taylor</h3>
            <p>Frontend Developer</p>
          </div>
        </article>
        <article class="team-member">
          <img class="team-member-avatar" src="assets/img2.jpeg" alt="" />
          <div class="team-member-name">
            <h3>Drew Caleb</h3>
            <p>Frontend Developer</p>
          </div>
        </article>
        <article class="team-member">
          <img class="team-member-avatar" src="assets/img3.jpeg" alt="" />
          <div class="team-member-name">
            <h3>Elizabeth Smith</h3>
            <p>Designer</p>
          </div>
        </article>
      </div>
    </div>
    <div class="group">
      <h2>My Team</h2>
      <div id="my-team">
        <article class="team-member">
          <img class="team-member-avatar" src="assets/img4.jpeg" alt="" />
          <div class="team-member-name">
            <h3>James Xander</h3>
            <p>Node.js Developer</p>
          </div>
        </article>
        <article class="team-member">
          <img class="team-member-avatar" src="assets/img5.jpeg" alt="" />
          <div class="team-member-name">
            <h3>Alex Smith</h3>
            <p>Frontend Developer</p>
          </div>
        </article>
        <article class="team-member">
          <img class="team-member-avatar" src="assets/img6.jpeg" alt="" />
          <div class="team-member-name">
            <h3>Blake Lambert</h3>
            <p>Project Manager</p>
          </div>
        </article>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
