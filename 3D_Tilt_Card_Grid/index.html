<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Tilt Card Grid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card-grid">
    <div class="card">
      <div class="card-content">
        <img src="https://picsum.photos/300/200?random=1" alt="Product" class="product-img">
        <h2 class="title">Futuristic Headphones</h2>
        <p class="desc">Immersive sound with noise cancellation and clarity.</p>
        <button class="buy-btn">Buy Now</button>
      </div>
    </div>

    <div class="card">
      <div class="card-content">
        <img src="https://picsum.photos/300/200?random=2" alt="Product" class="product-img">
        <h2 class="title">Smartwatch Pro</h2>
        <p class="desc">Track health, stay connected, futuristic design.</p>
        <button class="buy-btn">Buy Now</button>
      </div>
    </div>

    <div class="card">
      <div class="card-content">
        <img src="https://picsum.photos/300/200?random=4" alt="Product" class="product-img">
        <h2 class="title">Drone Xplorer</h2>
        <p class="desc">Capture stunning aerial shots with ease.</p>
        <button class="buy-btn">Buy Now</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
